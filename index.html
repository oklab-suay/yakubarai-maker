<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111127" />
  <title>厄落としメーカー</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="afterglow-choice.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="screen intro active" id="intro">
      <div class="moon"></div><div class="stars"></div>
      <div class="intro-copy">
        <p class="eyebrow">OCCULT KAACHAN presents</p>
        <h1>厄祓い<br><span>メーカー</span></h1>
        <p>指でぐるぐる、<br>モヤモヤを払ってみよう</p>
      </div>
      <button class="primary start" id="startButton">はじめる <i>→</i></button>
    </section>

    <section class="screen ritual" id="ritual">
      <canvas id="ritualCanvas" aria-label="厄落としの画面"></canvas>
      <div class="moya-layer" aria-hidden="true"></div>
      <div class="throw-target" id="throwTarget" aria-hidden="true"><span>厄</span></div>
      <div class="ritual-top">
        <p class="step" id="stepLabel">STEP 01</p>
        <p class="guide" id="guideLabel">モヤをぐるぐる集めてね</p>
      </div>
      <div class="gesture-hint" id="gestureHint" aria-hidden="true">
        <div class="gesture-orbit"><span>☝</span></div>
        <p>ここを、くるくる</p>
      </div>
      <div class="progress-wrap"><div class="progress"><span id="progressBar"></span></div><p id="statusLabel">モヤモヤを手放す準備中</p></div>
      <button class="ghost next" id="nextButton" disabled>祓う <i>→</i></button>
      <div class="success" id="success">
        <strong id="successText">厄を祓いました</strong><span>余白ができて、光が満ちていく…</span>
        <div class="afterglow-choice" id="afterglowChoice">
          <p>あなたは、余白をどう使う？</p>
          <span>ひとつ選んで、画像に残そう</span>
          <div class="afterglow-buttons">
            <button data-afterglow="open" aria-label="ひらく"><img src="images/hiraku.png" alt="ひらく" /></button>
            <button data-afterglow="rest" aria-label="やすむ"><img src="images/yasummu.png" alt="やすむ" /></button>
            <button data-afterglow="grow" aria-label="そだてる"><img src="images/sodateru.png" alt="そだてる" /></button>
            <button data-afterglow="flow" aria-label="流す"><img src="images/nagasu.png" alt="流す" /></button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen result" id="result">
      <div class="result-inner">
        <h2>今日の<br>厄落とし画像</h2>
        <div class="wallpaper-frame"><canvas id="previewCanvas"></canvas></div>
        <p class="result-message" id="resultMessage"></p>
        <div class="actions">
          <button class="primary" id="saveButton">画像を保存 <i>↓</i></button>
          <button class="outline" id="shareButton">Xに投稿 <i>↗</i></button>
          <button class="text-button" id="replayButton">もう一回</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="gesture-hint.js"></script>
  <script src="throw-target.js"></script>
  <script src="next-cta.js"></script>
  <script src="success-layout.js"></script>
  <script src="step-three.js"></script>
  <script src="copy-tuning.js"></script>
  <script src="prayer-seal.js"></script>
  <script src="image-footer.js"></script>
</body>
</html>
